[project]
name = "audiorepair"
version = "0.1.0"
description = "Make videos play in browsers/Chromecast by re-encoding only the audio (AC3/DTS to AAC), video copied"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["audiorepair"]

[tool.pytest.ini_options]
testpaths = ["tests"]
